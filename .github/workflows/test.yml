name: Build and Test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Full history so origin/main exists for the changed-package diff below.
          # With the default fetch-depth: 1, `git diff origin/main...HEAD` errors
          # and every PR silently falls back to building all packages.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build changed packages
        run: |
          # Determine changed packages from the PR diff
          CHANGED=$(git diff --name-only origin/main...HEAD | grep -oP 'pkgs/\K[^/]+' | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No package files changed; running flake check"
            nix flake check
          else
            for pkg in $CHANGED; do
              echo "Building $pkg"
              nix build ".#$pkg" --print-build-logs
            done
          fi

  # Separate job so it runs only after the build check above has completed —
  # enabling auto-merge from inside the build job fails with "unstable status"
  # because the PR's own required check is still pending.
  automerge:
    needs: build
    if: startsWith(github.head_ref, 'update-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge update PR
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          # No checkout in this job; gh resolves the repo from git remotes
          # otherwise and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge --auto --squash ${{ github.event.pull_request.number }}
